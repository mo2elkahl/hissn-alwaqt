name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: upload-artifact@v4
        with:
          name: Hissn-AlWaqt-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
